<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinCY 的網頁測試</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            text-align: center;
        }
        .container {
            border: 2px solid #007AFF;
            border-radius: 12px;
            padding: 40px;
            background-color: #f9f9f9;
        }
        h1 { color: #007AFF; }
        .status {
            display: inline-block;
            padding: 5px 15px;
            background-color: #4cd964;
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }
        .info {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 GitHub Pages 部署成功！</h1>
        <p class="status">Online</p>
        <p>這是在 M4 Mac 上透過 Git 推送的 <strong>web-activity</strong> 測試頁面。</p>
        
        <div class="info">
            <p>目前目錄狀態：已設定 .gitignore 忽略大型影片檔</p>
            <p>更新時間：2026年5月</p>
        </div>
    </div>
</body>
</html>
