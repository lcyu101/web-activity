<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的活動紀錄</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; color: #1a1a1a; }
  input, select, textarea, button { font-family: inherit; font-size: 14px; outline: none; }
  input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a1a; }
  input:focus, select:focus, textarea:focus { border-color: #888; }
  button { cursor: pointer; border-radius: 8px; border: 0.5px solid #ccc; background: transparent; color: #1a1a1a; padding: 8px 16px; }
  button:hover { background: #f0f0ee; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.4; cursor: default; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #ccc; border-top-color:#555; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const CLIENT_ID       = "207797886630-2vkpacgf5s140gpjmd54bd09fo25k1m4.apps.googleusercontent.com";
const API_KEY         = "AIzaSyDyIK8v5W9QMmdZg_lotj7W8n-dt7QAvH0";
const FOLDER_ID       = "1AdjewXblVuXicN5KBln2PVd91omyP2lk";
const DATA_FILE       = "activity_records.json";
const DEFAULT_FILE_ID = "1YDoyv3VWYA_pHw1ZDEJYjtzcfyoUcnH_";
const SCOPES          = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email";
const ADMIN_EMAILS    = ["lin9680@gmail.com","hng937@gmail.com","grace569888@gmail.com"];

const ACTIVITY_TYPES = [
  { key:"hiking",  label:"登山", icon:"▲" },
  { key:"travel",  label:"旅遊", icon:"✈" },
  { key:"cycling", label:"騎車", icon:"◎" },
  { key:"diving",  label:"潛水", icon:"◆" },
  { key:"running", label:"跑步", icon:"◉" },
  { key:"other",   label:"其他", icon:"●" },
];
const COLORS    = { hiking:"#3B6D11", travel:"#185FA5", cycling:"#BA7517", diving:"#0F6E56", running:"#993556", other:"#533489" };
const BG_COLORS = { hiking:"#EAF3DE", travel:"#E6F1FB", cycling:"#FAEEDA", diving:"#E1F5EE", running:"#FBEAF0", other:"#EEEDFE" };
const defaultForm = { id:null, title:"", date:"", endDate:"", location:"", type:"hiking", companions:"", route:"", note:"", tags:"", imageUrl:"", mediaItems:[] };

let accessToken = null;

async function driveGet(fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers:{ Authorization:`Bearer ${accessToken}` } });
  if (!res.ok) throw new Error("讀取失敗");
  return res.json();
}
async function driveList(name) {
  const q = encodeURIComponent(`name='${name}' and '${FOLDER_ID}' in parents and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers:{ Authorization:`Bearer ${accessToken}` } });
  return (await res.json()).files || [];
}
async function driveSaveJson(content, existingId) {
  const blob = new Blob([JSON.stringify(content)], { type:"application/json" });
  let fileId = existingId;
  if (existingId) {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
      method:"PATCH", headers:{ Authorization:`Bearer ${accessToken}`, "Content-Type":"application/json" }, body:blob,
    });
  } else {
    const fm = new FormData();
    fm.append("metadata", new Blob([JSON.stringify({ name:DATA_FILE, parents:[FOLDER_ID] })], { type:"application/json" }));
    fm.append("file", blob);
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method:"POST", headers:{ Authorization:`Bearer ${accessToken}` }, body:fm,
    });
    fileId = (await res.json()).id;
  }
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method:"POST", headers:{ Authorization:`Bearer ${accessToken}`, "Content-Type":"application/json" },
    body:JSON.stringify({ role:"reader", type:"anyone" }),
  }).catch(()=>{});
  return fileId;
}
async function driveUploadImage(file) {
  const fm = new FormData();
  fm.append("metadata", new Blob([JSON.stringify({ name:file.name, parents:[FOLDER_ID] })], { type:"application/json" }));
  fm.append("file", file);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method:"POST", headers:{ Authorization:`Bearer ${accessToken}` }, body:fm,
  });
  const fileId = (await res.json()).id;
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method:"POST", headers:{ Authorization:`Bearer ${accessToken}`, "Content-Type":"application/json" },
    body:JSON.stringify({ role:"reader", type:"anyone" }),
  });
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
}
async function loadFromDrive() {
  const files = await driveList(DATA_FILE);
  if (!files.length) return { records:[], fileId:null };
  const fileId = files[0].id;
  const records = await driveGet(fileId);
  return { records:Array.isArray(records)?records:[], fileId };
}
async function loadPublic(fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`);
  if (!res.ok) throw new Error("無法讀取");
  return res.json();
}
function getCachedFileId() { try { return localStorage.getItem("act_json_fid"); } catch { return null; } }
function setCachedFileId(id) { try { localStorage.setItem("act_json_fid", id); } catch {} }

function formatDate(d, e) {
  if (!d) return "";
  if (!e || e===d) return d;
  return `${d} ～ ${e}（${Math.round((new Date(e)-new Date(d))/86400000)+1} 天）`;
}
function getVideoEmbed(url) {
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
  return null;
}
function getVideoThumb(url) {
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
  return yt ? `https://img.youtube.com/vi/${yt[1]}/mqdefault.jpg` : null;
}
function TypeBadge({ type }) {
  const t = ACTIVITY_TYPES.find(a=>a.key===type)||ACTIVITY_TYPES[5];
  return <span style={{ fontSize:12, padding:"2px 10px", borderRadius:99, background:BG_COLORS[type]||"#F1EFE8", color:COLORS[type]||"#5F5E5A", fontWeight:500 }}>{t.icon} {t.label}</span>;
}

const s = {
  wrap:      { maxWidth:700, margin:"0 auto", padding:"1.5rem 1rem" },
  card:      { background:"#fff", border:"0.5px solid #ddd", borderRadius:12, marginBottom:12, overflow:"hidden", cursor:"pointer" },
  label:     { fontSize:16, color:"#1a1a1a", marginBottom:8, display:"inline-block", fontWeight:600, background:"#e8e8e4", padding:"3px 10px", borderRadius:6 },
  field:     { marginBottom:20 },
  back:      { fontSize:14, color:"#888", cursor:"pointer", marginBottom:"1rem", display:"inline-block" },
  filterBtn: (a) => ({ fontSize:13, padding:"5px 14px", borderRadius:99, border:"0.5px solid #ccc", background:a?"#1a1a1a":"transparent", color:a?"#fff":"#666", cursor:"pointer", marginBottom:4 }),
  thumb:     { width:"100%", aspectRatio:"1", objectFit:"cover", display:"block", borderRadius:8 },
  grid:      { display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))", gap:8, marginTop:12 },
  detailLbl: { fontSize:14, fontWeight:600, color:"#444", background:"#e8e8e4", display:"inline-block", padding:"2px 10px", borderRadius:6 },
};

function App() {
  const [records,     setRecords]     = useState([]);
  const [dataFileId,  setDataFileId]  = useState(null);
  const [isAdmin,     setIsAdmin]     = useState(false);
  const [view,        setView]        = useState("list");
  const [selected,    setSelected]    = useState(null);
  const [form,        setForm]        = useState(defaultForm);
  const [filter,      setFilter]      = useState("all");
  const [sortOrder,   setSortOrder]   = useState("desc");
  const [lightbox,    setLightbox]    = useState(null);
  const [addMediaUrl, setAddMediaUrl] = useState("");
  const [uploading,   setUploading]   = useState(false);
  const [status,      setStatus]      = useState("");
  const fileRef  = useRef();
  const coverRef = useRef();
  const dragIdx  = useRef(null);

  // ── 媒體操作 ──
  const removeMedia = (idx) => setForm(f => ({ ...f, mediaItems: f.mediaItems.filter((_,i) => i !== idx) }));
  const onDragStart = (i)   => { dragIdx.current = i; };
  const onDragOver  = (e)   => { e.preventDefault(); };
  const onDrop      = (i)   => {
    if (dragIdx.current === null || dragIdx.current === i) return;
    const items = [...form.mediaItems];
    const dragged = items.splice(dragIdx.current, 1)[0];
    items.splice(i, 0, dragged);
    setForm(f => ({ ...f, mediaItems: items }));
    dragIdx.current = null;
  };

  useEffect(() => {
    const fid = getCachedFileId() || DEFAULT_FILE_ID;
    setStatus("載入中...");
    loadPublic(fid)
      .then(r => { setRecords(Array.isArray(r)?r:[]); setDataFileId(fid); })
      .catch(e => console.log("公開讀取失敗：", e))
      .finally(() => setStatus(""));
  }, []);

  const reloadFromDrive = async () => {
    setStatus("載入中...");
    try {
      const { records:r, fileId } = await loadFromDrive();
      setRecords(r); setDataFileId(fileId);
      if (fileId) setCachedFileId(fileId);
    } catch(e) { alert("載入失敗："+e.message); }
    setStatus("");
  };

  const handleAdminLogin = () => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) { alert("登入失敗："+resp.error); return; }
        accessToken = resp.access_token;
        try {
          const res  = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers:{ Authorization:`Bearer ${accessToken}` } });
          const info = await res.json();
          if (!ADMIN_EMAILS.includes(info.email)) {
            alert(`帳號 ${info.email} 沒有管理者權限`);
            accessToken = null; return;
          }
        } catch(e) { alert("無法驗證帳號"); accessToken = null; return; }
        setIsAdmin(true);
        await reloadFromDrive();
      },
    });
    client.requestAccessToken();
  };
  const handleAdminLogout = () => { accessToken=null; setIsAdmin(false); };

  const persist = async (newList) => {
    setStatus("儲存中...");
    try {
      const fid = await driveSaveJson(newList, dataFileId);
      setDataFileId(fid); setCachedFileId(fid); setRecords(newList);
    } catch(e) { alert("儲存失敗："+e.message); }
    setStatus("");
  };

  const openNew    = () => { setForm({...defaultForm, id:Date.now(), mediaItems:[]}); setView("edit"); };
  const openEdit   = (r) => { setForm({...r, tags:r.tags.join(", "), mediaItems:r.mediaItems||[]}); setView("edit"); };
  const openDetail = (r) => { setSelected(r); setView("detail"); };

  const submitForm = async () => {
    if (!form.title||!form.date) { alert("請填寫標題和日期"); return; }
    const rec = {...form, tags:form.tags.split(",").map(t=>t.trim()).filter(Boolean)};
    const exists = records.find(r=>r.id===rec.id);
    await persist(exists ? records.map(r=>r.id===rec.id?rec:r) : [rec,...records]);
    setView("list");
  };
  const deleteRec = async (id) => {
    if (!confirm("確定刪除？")) return;
    await persist(records.filter(r=>r.id!==id));
    setView("list");
  };

  const addMediaByUrl = () => {
    const url = addMediaUrl.trim(); if (!url) return;
    const isVid = !!getVideoEmbed(url);
    const item = isVid ? { type:"video", url, thumb:getVideoThumb(url)||"" } : { type:"image", url, thumb:url };
    setForm(f=>({...f, mediaItems:[...(f.mediaItems||[]), item]}));
    setAddMediaUrl("");
  };
  const addMediaByFile = async (e) => {
    const files = Array.from(e.target.files); e.target.value="";
    setUploading(true);
    for (const file of files) {
      try { const url = await driveUploadImage(file); setForm(f=>({...f, mediaItems:[...(f.mediaItems||[]), {type:"image",url,thumb:url}]})); }
      catch(err) { alert("上傳失敗："+err.message); }
    }
    setUploading(false);
  };
  const addCoverByFile = async (e) => {
    const file = e.target.files[0]; if (!file) return; e.target.value="";
    setUploading(true);
    try { const url = await driveUploadImage(file); setForm(f=>({...f,imageUrl:url})); }
    catch(err) { alert("上傳失敗："+err.message); }
    setUploading(false);
  };

  const years = [...new Set(records.map(r=>r.date?.slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const filtered = (filter==="all" ? records
    : years.includes(filter) ? records.filter(r=>r.date?.startsWith(filter))
    : records.filter(r=>r.type===filter))
    .slice().sort((a,b)=>sortOrder==="desc"
      ? (b.date||"").localeCompare(a.date||"")
      : (a.date||"").localeCompare(b.date||""));

  // Lightbox
  if (lightbox) {
    const { items, idx } = lightbox;
    const cur = items[idx];
    const embedUrl = cur.type==="video" ? getVideoEmbed(cur.url) : null;
    return (
      <div onClick={()=>setLightbox(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:999, padding:16 }}>
        <div onClick={e=>e.stopPropagation()} style={{ maxWidth:640, width:"100%" }}>
          {embedUrl
            ? <iframe src={embedUrl} style={{ width:"100%", aspectRatio:"16/9", border:"none", borderRadius:8 }} allowFullScreen />
            : <img src={cur.url} style={{ width:"100%", maxHeight:"75vh", objectFit:"contain", borderRadius:8 }} alt="" />
          }
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:12, gap:8 }}>
            <button onClick={()=>setLightbox({items,idx:Math.max(0,idx-1)})} disabled={idx===0} style={{ color:"#fff", borderColor:"rgba(255,255,255,0.3)" }}>← 上一張</button>
            <button onClick={()=>setLightbox(null)} style={{ color:"#fff", borderColor:"rgba(255,255,255,0.3)" }}>關閉</button>
            <button onClick={()=>setLightbox({items,idx:Math.min(items.length-1,idx+1)})} disabled={idx===items.length-1} style={{ color:"#fff", borderColor:"rgba(255,255,255,0.3)" }}>下一張 →</button>
          </div>
        </div>
      </div>
    );
  }

  const TopBar = ({ title, backFn }) => (
    <div>
      {backFn && <span style={s.back} onClick={backFn}>← 返回</span>}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"1.5rem" }}>
        <h1 style={{ fontSize:22, fontWeight:500 }}>{title}</h1>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {status && <span style={{ fontSize:13, color:"#888" }}><span className="spinner"></span>{status}</span>}
          {isAdmin
            ? <button onClick={handleAdminLogout} style={{ fontSize:13, color:"#888" }}>登出管理</button>
            : <button onClick={handleAdminLogin} style={{ fontSize:13 }}>管理者登入</button>
          }
        </div>
      </div>
    </div>
  );

  // Edit view
  if (view==="edit") {
    const media = form.mediaItems||[];
    return (
      <div style={s.wrap}>
        <TopBar title={records.find(r=>r.id===form.id)?"編輯紀錄":"新增紀錄"} backFn={()=>setView("list")} />
        <div style={s.field}>
          <label style={s.label}>標題 *</label><br/>
          <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="例：雪山主峰" />
        </div>
        <div style={s.field}>
          <label style={s.label}>地點</label><br/>
          <input value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="例：苗栗縣" />
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:20 }}>
          <div>
            <label style={s.label}>開始日期 *</label><br/>
            <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} />
          </div>
          <div>
            <label style={s.label}>結束日期</label><br/>
            <input type="date" value={form.endDate||""} min={form.date||""} onChange={e=>setForm({...form,endDate:e.target.value})} />
          </div>
          <div>
            <label style={s.label}>活動類型</label><br/>
            <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
              {ACTIVITY_TYPES.map(t=><option key={t.key} value={t.key}>{t.icon} {t.label}</option>)}
            </select>
          </div>
        </div>
        <div style={s.field}>
          <label style={s.label}>同行人員</label><br/>
          <input value={form.companions||""} onChange={e=>setForm({...form,companions:e.target.value})} placeholder="例：小明、小華、阿偉" />
        </div>
        <div style={s.field}>
          <label style={s.label}>封面圖片</label><br/>
          <div style={{ display:"flex", gap:8, alignItems:"center", marginTop:4 }}>
            <input value={form.imageUrl} onChange={e=>setForm({...form,imageUrl:e.target.value})} placeholder="貼上網址，或上傳到 Google Drive" />
            <button onClick={()=>coverRef.current.click()} disabled={uploading}>上傳</button>
          </div>
          <input ref={coverRef} type="file" accept="image/*" style={{ display:"none" }} onChange={addCoverByFile} />
          {form.imageUrl && <img src={form.imageUrl} alt="" style={{ marginTop:8, height:90, borderRadius:8, objectFit:"cover" }} onError={e=>e.target.style.display="none"} />}
        </div>
        <div style={{ marginBottom:20, padding:"16px", border:"0.5px solid #ddd", borderRadius:12, background:"#fafaf8" }}>
          <label style={s.label}>相片 / 影片</label>
          <div style={{ display:"flex", gap:8, margin:"10px 0" }}>
            <input value={addMediaUrl} onChange={e=>setAddMediaUrl(e.target.value)}
              placeholder="貼上圖片網址或 YouTube / Vimeo 連結"
              onKeyDown={e=>e.key==="Enter"&&addMediaByUrl()} />
            <button onClick={addMediaByUrl}>加入</button>
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={addMediaByFile} />
          <button onClick={()=>fileRef.current.click()} disabled={uploading}>
            {uploading ? <><span className="spinner"></span>上傳中...</> : "從裝置上傳相片到 Drive"}
          </button>
          {media.length>0 && (
            <>
              <p style={{ fontSize:12, color:"#888", marginTop:10 }}>拖曳縮圖可調整順序</p>
              <div style={s.grid}>
                {media.map((m,i)=>(
                  <div key={i}
                    draggable
                    onDragStart={()=>onDragStart(i)}
                    onDragOver={onDragOver}
                    onDrop={()=>onDrop(i)}
                    style={{ position:"relative", cursor:"grab", opacity:dragIdx.current===i?0.4:1 }}>
                    <img src={m.thumb||m.url} style={s.thumb} alt="" />
                    {m.type==="video" && <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.35)", borderRadius:8 }}><span style={{ fontSize:24, color:"#fff" }}>▶</span></div>}
                    <div style={{ position:"absolute", top:4, left:4, background:"rgba(0,0,0,0.5)", color:"#fff", fontSize:11, borderRadius:4, padding:"1px 5px" }}>{i+1}</div>
                    <button onClick={()=>removeMedia(i)} style={{ position:"absolute", top:4, right:4, width:22, height:22, borderRadius:"50%", background:"rgba(0,0,0,0.6)", color:"#fff", border:"none", fontSize:13, lineHeight:"22px", textAlign:"center", padding:0 }}>×</button>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        <div style={s.field}>
          <label style={s.label}>路線</label><br/>
          <textarea style={{ height:80, resize:"vertical", marginTop:4 }} value={form.route} onChange={e=>setForm({...form,route:e.target.value})} placeholder="描述行走路線或交通方式..." />
        </div>
        <div style={s.field}>
          <label style={s.label}>心得</label><br/>
          <textarea style={{ height:100, resize:"vertical", marginTop:4 }} value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="分享這次活動的感受..." />
        </div>
        <div style={s.field}>
          <label style={s.label}>標籤（逗號分隔）</label><br/>
          <input style={{ marginTop:4 }} value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="例：百岳, 三千米, 夜宿山屋" />
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button className="primary" onClick={submitForm} disabled={!!status}>儲存</button>
          <button onClick={()=>setView("list")}>取消</button>
        </div>
      </div>
    );
  }

  // Detail view
  if (view==="detail" && selected) {
    const media = selected.mediaItems||[];
    return (
      <div style={s.wrap}>
        <TopBar title="" backFn={()=>setView("list")} />
        {selected.imageUrl && (
          <div style={{ borderRadius:12, overflow:"hidden", marginBottom:16, height:240 }}>
            <img src={selected.imageUrl} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
          </div>
        )}
        <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:12 }}>
          <h1 style={{ fontSize:22, fontWeight:500 }}>{selected.title}</h1>
          {isAdmin && (
            <div style={{ display:"flex", gap:8, flexShrink:0 }}>
              <button onClick={()=>openEdit(selected)}>編輯</button>
              <button onClick={()=>deleteRec(selected.id)} style={{ color:"#c0392b" }}>刪除</button>
            </div>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20, flexWrap:"wrap" }}>
          <TypeBadge type={selected.type} />
          <span style={{ fontSize:13, color:"#666" }}>{formatDate(selected.date, selected.endDate)}</span>
          {selected.location && <span style={{ fontSize:13, color:"#666" }}>📍 {selected.location}</span>}
        </div>
        {selected.companions && <div style={{ marginBottom:16 }}><div style={s.detailLbl}>同行人員</div><p style={{ fontSize:15, lineHeight:1.8, marginTop:8 }}>{selected.companions}</p></div>}
        {media.length>0 && (
          <div style={{ marginBottom:20 }}>
            <div style={s.detailLbl}>相片 / 影片（{media.length}）</div>
            <div style={s.grid}>
              {media.map((m,i)=>(
                <div key={i} style={{ position:"relative", cursor:"pointer" }} onClick={()=>setLightbox({items:media,idx:i})}>
                  <img src={m.thumb||m.url} style={s.thumb} alt="" />
                  {m.type==="video" && <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.35)", borderRadius:8 }}><span style={{ fontSize:28, color:"#fff" }}>▶</span></div>}
                </div>
              ))}
            </div>
          </div>
        )}
        {selected.route && <div style={{ marginBottom:16 }}><div style={s.detailLbl}>路線</div><p style={{ fontSize:15, lineHeight:1.8, marginTop:8, whiteSpace:"pre-wrap" }}>{selected.route}</p></div>}
        {selected.note  && <div style={{ marginBottom:16 }}><div style={s.detailLbl}>心得</div><p style={{ fontSize:15, lineHeight:1.8, marginTop:8, whiteSpace:"pre-wrap" }}>{selected.note}</p></div>}
        {selected.tags?.length>0 && (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:16 }}>
            {selected.tags.map(t=><span key={t} style={{ fontSize:12, padding:"3px 10px", borderRadius:99, background:"#f0f0ee", color:"#666", border:"0.5px solid #ddd" }}>#{t}</span>)}
          </div>
        )}
      </div>
    );
  }

  // List view
  return (
    <div style={s.wrap}>
      <TopBar title="我的活動紀錄" />
      {isAdmin && <button className="primary" onClick={openNew} style={{ marginBottom:"1.5rem" }}>＋ 新增</button>}
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:"0.75rem", alignItems:"center" }}>
        <button style={s.filterBtn(filter==="all")} onClick={()=>setFilter("all")}>全部（{records.length}）</button>
        {ACTIVITY_TYPES.map(t=>{ const c=records.filter(r=>r.type===t.key).length; return c>0&&<button key={t.key} style={s.filterBtn(filter===t.key)} onClick={()=>setFilter(t.key)}>{t.icon} {t.label}（{c}）</button>; })}
        <div style={{ marginLeft:"auto", display:"flex", gap:6, alignItems:"center" }}>
          <span style={{ fontSize:13, color:"#888" }}>排序：</span>
          <button style={s.filterBtn(sortOrder==="desc")} onClick={()=>setSortOrder("desc")}>新→舊</button>
          <button style={s.filterBtn(sortOrder==="asc")}  onClick={()=>setSortOrder("asc")}>舊→新</button>
        </div>
      </div>
      {years.length>0 && (
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:"1.5rem", alignItems:"center" }}>
          <span style={{ fontSize:13, color:"#888" }}>年度：</span>
          {years.map(y=>{ const c=records.filter(r=>r.date?.startsWith(y)).length; return <button key={y} style={s.filterBtn(filter===y)} onClick={()=>setFilter(y)}>{y}（{c}）</button>; })}
        </div>
      )}
      {filtered.length===0 && records.length>0 && <p style={{ color:"#888", textAlign:"center", padding:"2rem 0" }}>沒有符合的紀錄</p>}
      {filtered.map(r=>(
        <div key={r.id} style={s.card} onClick={()=>openDetail(r)}>
          <div style={{ display:"flex" }}>
            {r.imageUrl && <div style={{ width:110, flexShrink:0 }}><img src={r.imageUrl} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} onError={e=>e.target.parentElement.style.display="none"} /></div>}
            <div style={{ padding:"14px 16px", flex:1, minWidth:0 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, flexWrap:"wrap" }}>
                <TypeBadge type={r.type} />
                <span style={{ fontSize:12, color:"#888" }}>{formatDate(r.date, r.endDate)}</span>
                {r.location && <span style={{ fontSize:12, color:"#888" }}>📍 {r.location}</span>}
                {r.mediaItems?.length>0 && <span style={{ fontSize:12, color:"#888" }}>🖼 {r.mediaItems.length}</span>}
              </div>
              <div style={{ fontSize:16, fontWeight:500, marginBottom:4, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{r.title}</div>
              {r.note && <p style={{ margin:0, fontSize:13, color:"#888", overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>{r.note}</p>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
